name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy env so the app can boot during typecheck/build (validation runs at import-time).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long-xyz
      ENCRYPTION_KEY: aGVsbG8td29ybGQtdGhpcy1pcy0zMi1ieXRlcy1sb25n
      COOKIE_PREFIX: app
      NEXT_PUBLIC_COOKIE_PREFIX: app
      AUTH_FORGOT_TARGET_LATENCY_MS: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # .nvmrc = Node 24 — aligné sur le poste de dev. Node 20 ne sait pas
      # require() un module ESM (ERR_REQUIRE_ESM) : html-encoding-sniffer@6
      # (dépendance de jsdom, via le lockfile) est ESM-only et cassait TOUS
      # les runs CI depuis le 2026-07-21 alors que la même suite passait en
      # local (Node 24). Vercel n'utilise pas .nvmrc (réglage projet).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Prisma generate
        run: pnpm --filter frontend exec prisma generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fail the build on high/critical CVEs in production deps.
      # Dev-only advisories are tolerated (they don't ship to users).
      # The npm registry's audit endpoint intermittently serves raw-gzip
      # responses that pnpm (9 AND 10) can't parse ("is not valid JSON",
      # payload starts with the gzip magic bytes 1f 8b). That's registry
      # infrastructure, not a vulnerability — warn and skip instead of
      # going red; every real audit finding still fails the build.
      - name: Audit (prod deps, high+ severity)
        run: |
          set +e
          out=$(pnpm audit --prod --audit-level=high 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -q "is not valid JSON"; then
            echo "::warning::npm audit endpoint returned a corrupt (gzip) response — audit skipped for this run."
            exit 0
          fi
          exit $code
